id: demo
name: demo
description: demo
practice_area: Quality Engineering
good_at:
  - validation
  - analyser
agents:
- test_case_generator_v1
- test_case_reviewer_v2
execution:
  type: graph
  steps:
  - id: step_1
    type: agent
    agent: test_case_generator_v1
    next: step_2

  - id: step_2
    type: agent
    agent: test_case_reviewer_v2
    next: step_3

  - id: step_3
    type: condition
    condition: quality_score >= 70
    if_false: step_1