id: demo_workflow
name: demo workflow
description: demo
practice_area: testing
good_at: demo
agents:
- test_case_generator_v1
- test_case_reviewer_v2
execution:
  type: graph
  steps:
  - id: step1
    type: agent
    agent: test_case_generator_v1
    next: step2
  - id: step2
    type: agent
    agent: test_case_reviewer_v2
    next: step3
  - id: step3
    type: condition
    condition: quality_score >= 90
    if_false: step1
