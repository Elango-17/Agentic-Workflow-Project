[project]
name = "enterprise-agent-framework"
version = "0.1.0"
description = "CLI-first enterprise agent/workflow scaffolding framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1.0", "rich>=13.9,<15.0", "pydantic>=2.10,<3.0", "PyYAML>=6.0,<7.0", "python-dotenv>=1.0,<2.0"]
[project.optional-dependencies]
openai = ["openai>=1.99,<2.0"]
crewai = ["crewai>=0.100,<2.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.12,<1.0"]
[project.scripts]
eaf = "enterprise_agent_framework.cli.main:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
